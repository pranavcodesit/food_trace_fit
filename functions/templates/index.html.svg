<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Food Scanner</h1>
            <p>Scan food barcodes to get detailed nutritional information</p>
            <div class="header-decoration">
                <span class="decoration-dot"></span>
                <span class="decoration-dot"></span>
                <span class="decoration-dot"></span>
            </div>
            <div class="app-controls">
                <button id="dark-mode-toggle" class="btn icon-btn" title="Toggle Dark Mode">
                    <i class="mode-icon"></i>
                </button>
            </div>
        </header>

        <main>
            <div class="scanner-container">
                <div id="scanner-wrapper">
                    <video id="scanner" autoplay playsinline></video>
                    <div id="scanner-overlay">
                        <div class="scan-region"></div>
                    </div>
                </div>
                <div class="scanner-controls">
                    <button id="start-scanner" class="btn primary"><i class="scanner-icon start"></i>Start Scanner</button>
                    <button id="stop-scanner" class="btn secondary" disabled><i class="scanner-icon stop"></i>Stop Scanner</button>
                    <button id="switch-camera" class="btn icon-btn" title="Switch Camera" disabled><i class="camera-switch-icon"></i></button>
                </div>
                <div class="manual-entry">
                    <input type="text" id="barcode-input" placeholder="Or enter barcode manually...">
                    <button id="submit-barcode" class="btn primary"><i class="submit-icon"></i>Submit</button>
                </div>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Fetching product information...</p>
                <div class="loading-dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <div id="product-info" class="hidden">
                <div class="product-header">
                    <div class="product-image">
                        <img id="product-img" src="" alt="Product Image">
                    </div>
                    <div class="product-title">
                        <h2 id="product-name"></h2>
                        <p id="product-brand"></p>
                        <div class="grades-container">
                            <div class="grade-item">
                                <span class="grade-label">Nutrition Grade:</span>
                                <span id="nutrition-grade" class="nutrition-grade"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="product-details">
                    <div class="detail-section health-score-tile">
                        <h3><i class="health-score-icon"></i>Health Score</h3>
                        <div class="health-score-container">
                            <div class="score-meter-container">
                                <div class="score-meter">
                                    <div id="major-ticks">
                                        <span>0</span>
                                        <span>50</span>
                                        <span>100</span>
                                    </div>
                                    <div id="minor-ticks">
                                        <span title="--i:1"></span>
                                        <span title="--i:2"></span>
                                        <span title="--i:3"></span>
                                        <span title="--i:4"></span>
                                        <span title="--i:5"></span>
                                        <span title="--i:6"></span>
                                        <span title="--i:7"></span>
                                        <span title="--i:8"></span>
                                        <span title="--i:9"></span>
                                        <span title="--i:10"></span>
                                        <span title="--i:11"></span>
                                        <span title="--i:12"></span>
                                        <span title="--i:13"></span>
                                    </div>
                                    <div id="minor-ticks-bottom-mask"></div>
                                    <div id="bottom-circle"></div>
                                    <svg version="1.1" baseProfile="full" width="190" height="190" xmlns="http://www.w3.org/2000/svg">
                                        <linearGradient id="gradient" x1="0" x2="1" y1="0" y2="0">
                                            <stop offset="0%" stop-color="#e74c3c"/>
                                            <stop offset="50%" stop-color="#f39c12"/>
                                            <stop offset="100%" stop-color="#27ae60"/>
                                        </linearGradient>
                                        <path d="M5 95 A80 80 0 0 1 185 95" stroke="url(#gradient)" fill="none" stroke-width="10"
                                        stroke-linecap="round" stroke-dasharray="0 282.78" id="meter-arc"/>
                                    </svg>
                                    <div id="center-circle">
                                        <span id="health-score" class="health-score"></span>
                                    </div>
                                </div>
                                <div class="health-rating-container">
                                    <span id="health-rating" class="health-rating"></span>
                                    <span id="health-rating-text" class="health-rating-text"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="detail-section info-tile">
                        <h3><i class="info-icon"></i>General Information</h3>
                        <div class="detail-item">
                            <span class="label">Barcode:</span>
                            <span id="barcode"></span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Categories:</span>
                            <span id="categories"></span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Serving Size:</span>
                            <span id="serving-size"></span>
                        </div>
                        <div class="detail-item">
                            <span class="label">Data Source:</span>
                            <span id="data-source"></span>
                        </div>
                    </div>

                    <div class="detail-section ingredients-tile">
                        <h3><i class="ingredients-icon"></i>Ingredients</h3>
                        <p id="ingredients"></p>
                    </div>

                    <div class="detail-section allergens-tile">
                        <h3><i class="allergens-icon"></i>Allergens</h3>
                        <div id="allergens" class="tags"></div>
                    </div>

                    <div class="detail-section recommendation-tile">
                        <h3><i class="recommendation-icon"></i>Health Recommendation</h3>
                        <p id="health-recommendation"></p>
                    </div>

                    <div class="detail-section alternatives-tile">
                        <h3><i class="alternatives-icon"></i>Healthier Alternatives</h3>
                        <div id="alternative-products" class="alternatives-list"></div>
                    </div>

                    <div class="detail-section nutrition-tile">
                        <h3><i class="nutrition-icon"></i>Nutrition Facts (per 100g)</h3>
                        <div class="nutrition-grid">
                            <div class="nutrition-item">
                                <span class="nutrition-value" id="energy"></span>
                                <span class="nutrition-label">Energy</span>
                            </div>
                            <div class="nutrition-item">
                                <span class="nutrition-value" id="fat"></span>
                                <span class="nutrition-label">Fat</span>
                            </div>
                            <div class="nutrition-item">
                                <span class="nutrition-value" id="protein"></span>
                                <span class="nutrition-label">Protein</span>
                            </div>
                            <div class="nutrition-item">
                                <span class="nutrition-value" id="carbs"></span>
                                <span class="nutrition-label">Carbs</span>
                            </div>
                            <div class="nutrition-item">
                                <span class="nutrition-value" id="sugar"></span>
                                <span class="nutrition-label">Sugar</span>
                            </div>
                            <div class="nutrition-item">
                                <span class="nutrition-value" id="salt"></span>
                                <span class="nutrition-label">Salt</span>
                            </div>
                            <div class="nutrition-item">
                                <span class="nutrition-value" id="fiber"></span>
                                <span class="nutrition-label">Fiber</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="error-message" class="hidden">
                <div class="error-icon">❌</div>
                <p id="error-text"></p>
                <button id="try-again" class="btn primary">Try Again</button>
            </div>
        </main>

        <div id="api-status" class="api-status-container">
            <!-- API status will be populated by JavaScript -->
        </div>

        <footer>
            <p>Data provided by multiple sources including <a href="https://world.openfoodfacts.org/" target="_blank">Open Food Facts</a>, <a href="https://fdc.nal.usda.gov/" target="_blank">USDA FoodData Central</a>, <a href="https://developer.edamam.com/food-database-api" target="_blank">Edamam Food Database</a>, <a href="https://github.com/ifct2017/ifct2017" target="_blank">Indian Food Composition Database (IFCT 2017)</a>, and <a href="https://console.groq.com/" target="_blank">Groq AI</a> for filling missing data</p>
        </footer>
    </div>

    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>