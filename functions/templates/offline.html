<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Food Scanner</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#3498db">
    <style>
        .offline-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 20px;
        }
        
        .offline-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        
        .offline-title {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--secondary-color);
        }
        
        .offline-message {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: var(--muted-color);
            max-width: 600px;
        }
        
        .cached-content {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 600px;
        }
        
        .cached-content h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        
        .cached-list {
            list-style-type: none;
        }
        
        .cached-list li {
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .cached-list li:last-child {
            border-bottom: none;
        }
        
        .retry-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .retry-btn:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Food Scanner</h1>
            <p>Scan food barcodes to get detailed nutritional information</p>
            <div class="header-decoration">
                <span class="decoration-dot"></span>
                <span class="decoration-dot"></span>
                <span class="decoration-dot"></span>
            </div>
        </header>
        
        <div class="offline-container">
            <svg class="offline-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
            
            <h2 class="offline-title">You're Offline</h2>
            <p class="offline-message">It looks like you're not connected to the internet. Some features may not be available while offline.</p>
            
            <button class="retry-btn" onclick="window.location.reload()">
                Try Again
            </button>
            
            <div class="cached-content">
                <h3>Available Offline Content</h3>
                <ul class="cached-list">
                    <li><a href="/education/nutrition-basics">Nutrition Education Basics</a></li>
                    <li><a href="/education/food-labels">Food Label Guide</a></li>
                    <li><a href="/education/seasonal-foods">Seasonal Food Guide</a></li>
                </ul>
            </div>
        </div>
    </div>
    
    <script>
        // Check if we're back online
        window.addEventListener('online', () => {
            window.location.reload();
        });
        
        // Dark mode support
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
