<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db" />
      <stop offset="100%" stop-color="#2c3e50" />
    </linearGradient>
  </defs>
  <circle cx="96" cy="96" r="96" fill="url(#gradient)" />
  <g fill="#ffffff" transform="translate(48, 48) scale(0.8)">
    <!-- Barcode scanner frame -->
    <rect x="10" y="20" width="100" height="80" rx="4" fill="none" stroke="#ffffff" stroke-width="6" />
    
    <!-- Scanner line -->
    <line x1="20" y1="60" x2="100" y2="60" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
      <animate attributeName="y1" values="30;90;30" dur="2s" repeatCount="indefinite" />
      <animate attributeName="y2" values="30;90;30" dur="2s" repeatCount="indefinite" />
    </line>
    
    <!-- Corner markers -->
    <path d="M10,40 L10,20 L30,20" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M90,20 L110,20 L110,40" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M10,80 L10,100 L30,100" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M90,100 L110,100 L110,80" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>